<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlinkIdle Stage 1 — 独立学習プロジェクト</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Hiragino Sans","Yu Gothic UI",sans-serif; background:#0a0e17; color:#e0e7f0;
         display:flex; height:100vh; overflow:hidden; }
  #gameArea { flex:1; position:relative; display:flex; align-items:center; justify-content:center; }
  #gameCanvas { background:#0f1420; border-radius:8px; box-shadow:0 0 40px rgba(0,0,0,.6); max-width:100%; max-height:100%; }
  #dropBtn { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:5;
    padding:10px 28px; font-size:16px; font-weight:bold; color:#3a2a00;
    background:linear-gradient(180deg,#ffd54f,#ffb300); border:none; border-radius:8px; cursor:pointer; }
  #pauseBtn { position:absolute; top:14px; left:14px; z-index:5; padding:8px 14px; font-size:13px;
    background:#27364f; color:#e0e7f0; border:1px solid #3a4d6e; border-radius:6px; cursor:pointer; }
  #sidePanel { width:300px; background:#131a28; border-left:1px solid #1f2c42; padding:12px; overflow-y:auto; }
  #sidePanel h2 { font-size:14px; color:#ffd54f; margin-bottom:8px; }
  #skillBar { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .skill { flex:1; min-width:80px; background:#2a1f3d; border:1px solid #6a4a8a; border-radius:6px;
           padding:6px; text-align:center; font-size:11px; cursor:pointer; }
  .skill.cd { opacity:.5; cursor:not-allowed; }
  .skill .cd { color:#90caf9; font-size:10px; margin-top:2px; }
  .groupTitle { font-size:12px; color:#90caf9; margin:10px 0 6px; padding-bottom:3px; border-bottom:1px solid #1f2c42; }
  .upgrade { background:#1a2538; border:1px solid #27364f; border-radius:8px; padding:8px; margin-bottom:6px; }
  .upgrade.locked { opacity:.45; }
  .upgrade.maxed { border-color:#81c784; }
  .upgrade .name { font-weight:bold; font-size:12px; }
  .upgrade .lvl { float:right; color:#90a4bc; font-weight:normal; }
  .upgrade .desc { font-size:10px; color:#90a4bc; margin:3px 0; line-height:1.4; }
  .upgrade .meta { font-size:11px; color:#ffd54f; margin-bottom:5px; }
  .upgrade button { width:100%; padding:6px; font-size:12px; font-weight:bold; color:#0f1420;
    background:linear-gradient(180deg,#81c784,#66bb6a); border:none; border-radius:6px; cursor:pointer; }
  .upgrade button:disabled { background:#37465f; color:#6b7a90; cursor:not-allowed; }
  #saveStatus { font-size:10px; color:#6b7a90; margin-top:10px; text-align:center; }
  .provenance { font-size:9px; color:#6b7a90; line-height:1.5; margin-top:10px; padding:8px; background:#0f1725; border-radius:6px; }
  #portfolioLink { position:absolute; bottom:10px; left:10px; font-size:11px; color:#90caf9; z-index:5; }
  @media (max-width:700px) { body { flex-direction:column; } #sidePanel { width:100%; height:40vh; } }
</style>
</head>
<body>
  <div id="gameArea">
    <button id="pauseBtn">⏸ 一時停止</button>
    <button id="dropBtn">▼ ボールを落とす</button>
    <canvas id="gameCanvas" width="520" height="720"></canvas>
    <a id="portfolioLink" href="index.html">← ポートフォリオへ戻る</a>
  </div>
  <div id="sidePanel">
    <h2>スキル</h2>
    <div id="skillBar"></div>
    <div id="upgradeList"></div>
    <div id="saveStatus">自動保存中…</div>
    <div class="provenance">
      本作品は学習目的の独立実装であり、公式作品ではありません。<br>
      数値はリバースエンジニアリングにより独自再現したものです。
    </div>
  </div>
  <script src="src/config.js"></script>
  <script src="src/curves.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/board.js"></script>
  <script src="src/economy.js"></script>
  <script src="src/upgrades.js"></script>
  <script src="src/save.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
