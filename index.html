<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbloom</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"MS Gothic","Yu Gothic UI",monospace; }
  :root {
    --bg:#150a24; --panel:#2a1848; --panel2:#3a2260; --border:#6a3fa0;
    --hi:#ff5a8a; --red:#c9405a; --gold:#ffd54f; --text:#f0e6ff; --dim:#9a7fc0;
  }
  html,body { height:100%; background:#000; color:var(--text); overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }

  #menu { width:1280px; height:720px; flex-shrink:0; position:relative; overflow:hidden;
    background:radial-gradient(1200px 700px at 70% 20%, #2a1444 0%, #150a24 55%, #0a0516 100%);
    display:flex; flex-direction:column; }

  /* ---- 背景装饰：星点 / 彩虹 / 月亮 ---- */
  .star { position:absolute; background:#fff; border-radius:50%; opacity:.7; }
  .moon { position:absolute; right:-40px; bottom:30px; width:240px; height:240px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #4a2f6a, #2a1840); opacity:.45; }
  .menu-rainbow { position:absolute; left:-60px; bottom:120px; width:520px; height:520px; opacity:.5; }

  /* ---- 顶部栏 ---- */
  #topBar { height:44px; background:var(--panel); border-bottom:2px solid var(--border);
    display:flex; align-items:stretch; gap:0; flex-shrink:0; z-index:5; }
  .tb-left { display:flex; align-items:center; gap:6px; padding:0 8px; }
  .tb-btn { width:32px; height:32px; background:var(--panel2); border:2px solid var(--border);
    color:var(--text); cursor:pointer; font-size:14px; border-radius:3px; }
  .tb-rank { display:flex; align-items:center; gap:6px; padding:0 10px; background:var(--panel2);
    border:2px solid var(--border); border-radius:4px; font-size:13px; }
  .tb-progress { flex:1; display:flex; align-items:center; padding:0 14px; }
  .tb-progress .bar { flex:1; height:12px; background:#0d0618; border:1px solid var(--border); }
  .tb-progress .fill { height:100%; background:linear-gradient(90deg,#a04ad0,#ff5a8a); width:0%; }
  .tb-cur { display:flex; gap:8px; padding:0 10px; align-items:center; }
  .tb-cur .cur { background:var(--panel2); border:2px solid var(--border); border-radius:5px;
    padding:5px 10px; font-size:13px; }

  /* ---- 标题 ---- */
  .title-wrap { text-align:center; margin-top:34px; z-index:5; }
  .logo { font-size:84px; font-weight:900; letter-spacing:2px; color:#ffd54f;
    text-shadow: 4px 4px 0 #7a3a2a, -2px -2px 0 #7a3a2a, 2px -2px 0 #7a3a2a, -2px 2px 0 #7a3a2a,
      0 6px 0 rgba(0,0,0,.4); }
  .demo { display:inline-block; margin-top:4px; font-size:30px; font-weight:bold; letter-spacing:6px;
    color:var(--dim); border:3px solid var(--border); border-radius:6px; padding:2px 18px; }

  /* ---- 关卡卡片 ---- */
  .levels { flex:1; display:flex; align-items:center; justify-content:center; gap:46px; z-index:5; }
  .level { display:flex; flex-direction:column; align-items:center; gap:14px; width:230px; }
  .stage-card { width:210px; height:150px; background:var(--panel2); border:3px solid var(--border);
    border-radius:10px; position:relative; overflow:hidden; }
  .stage-card.playable { cursor:pointer; }
  .stage-card.playable:hover { border-color:var(--hi); }
  .stage-card .thumb { position:absolute; inset:10px; border-radius:6px; overflow:hidden;
    background:linear-gradient(#c4d4e1, #6d8ca3); }
  .stage-card .thumb .grass { position:absolute; left:0; right:0; bottom:0; height:26px; background:#4f7d3a; }
  .stage-card .thumb .arc { position:absolute; right:-30px; bottom:10px; width:120px; height:120px;
    border-radius:50%; border:8px solid transparent;
    border-top-color:#e86a6a; border-right-color:#f2cf55; border-bottom-color:#7fc47f; }
  .stage-card .num { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--red); border:2px solid #e0607a; color:#fff; font-size:26px; font-weight:bold;
    width:52px; height:42px; border-radius:6px; display:flex; align-items:center; justify-content:center; }
  .stage-card.locked { opacity:.5; }
  .stage-card .lock { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:34px; }
  .stage-card .locktag { position:absolute; top:8px; left:10px; font-size:12px; color:var(--dim); }

  .stars { display:flex; gap:6px; font-size:26px; color:var(--dim); }
  .stars .on { color:var(--gold); }
  .track { width:210px; height:10px; background:#0d0618; border:1px solid var(--border); border-radius:5px; }
  .track .fill { height:100%; background:linear-gradient(90deg,#a04ad0,#ff5a8a); }

  /* ---- 底部按钮 ---- */
  #bottomBar { height:96px; display:flex; align-items:center; justify-content:center; gap:26px; z-index:5; }
  .bar-btn { width:64px; height:64px; background:var(--panel2); border:3px solid var(--border);
    border-radius:8px; color:var(--text); font-size:26px; cursor:pointer; display:flex;
    align-items:center; justify-content:center; text-decoration:none; }
  .bar-btn.big { width:280px; height:72px; background:var(--red); border-color:#e0607a; font-size:34px; }
  .bar-btn.big:hover { background:#a0304a; }
  .version { position:absolute; left:10px; bottom:8px; font-size:12px; color:var(--dim); z-index:5; }
  .side-badge { position:absolute; left:10px; top:60px; display:flex; flex-direction:column; gap:10px; z-index:5; }
  .side-badge .b { background:var(--panel2); border:2px solid var(--border); border-radius:6px;
    padding:8px 12px; font-size:13px; display:flex; align-items:center; gap:8px; }
</style>
</head>
<body>
<div id="menu">
  <!-- 背景装饰由 JS 生成星点 -->
  <div class="moon"></div>

  <div id="topBar">
    <div class="tb-left">
      <button class="tb-btn">✕</button>
      <button class="tb-btn">🔊</button>
      <button class="tb-btn">🎵</button>
    </div>
    <div class="tb-rank">🏆 <span id="rankLabel">ランク0</span></div>
    <div class="tb-progress"><div class="bar"><div class="fill" id="menuFill"></div></div></div>
    <div class="tb-cur">
      <div class="cur">🔵 <span id="menuBalls">0</span></div>
      <div class="cur">🪙 <span id="menuCoins">0</span></div>
    </div>
  </div>

  <div class="title-wrap">
    <div class="logo">Orbloom</div>
    <div class="demo">DEMO</div>
  </div>

  <div class="levels">
    <div class="level">
      <div class="stage-card playable" id="stage1">
        <div class="thumb"><div class="arc"></div><div class="grass"></div></div>
        <div class="num">1</div>
      </div>
      <div class="stars" id="stars1">☆☆☆</div>
      <div class="track"><div class="fill" id="track1" style="width:0%"></div></div>
    </div>

    <div class="level">
      <div class="stage-card locked">
        <div class="locktag">Stage 1-2</div>
        <div class="lock">🔒</div>
      </div>
      <div class="stars">☆☆☆</div>
      <div class="track"><div class="fill" style="width:0%"></div></div>
    </div>

    <div class="level">
      <div class="stage-card locked">
        <div class="locktag">Stage 2-1</div>
        <div class="lock">🔒</div>
      </div>
      <div class="stars">☆☆☆</div>
      <div class="track"><div class="fill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="side-badge">
    <div class="b">🎮 ウィッシュリスト</div>
    <div class="b">⭐ フィードバック送信</div>
  </div>

  <div id="bottomBar">
    <button class="bar-btn" title="設定">⚙</button>
    <button class="bar-btn" title="チェック">☑</button>
    <a class="bar-btn big" href="game.html" title="プレイ">▶</a>
    <button class="bar-btn" title="アップグレード">⬆</button>
    <button class="bar-btn" title="情報">ⓘ</button>
  </div>

  <div class="version">Version: 0.8.5-demo</div>
</div>

<script>
  // 星点背景
  (function(){
    var menu = document.getElementById('menu');
    for (var i=0;i<60;i++){
      var s = document.createElement('div');
      s.className = 'star';
      var sz = 1 + Math.random()*2;
      s.style.width = sz+'px'; s.style.height = sz+'px';
      s.style.left = Math.random()*100+'%';
      s.style.top = Math.random()*70+'%';
      s.style.opacity = (0.3+Math.random()*0.6).toFixed(2);
      menu.appendChild(s);
    }
  })();

  // 读取存档显示进度/星级
  (function(){
    var KEY = 'plinko_idle_prototype_save_v2';
    function fmt(n){
      if (n < 1000) return Math.floor(n).toString();
      var units = ['K','M','B','T']; var u = -1; var v = n;
      while (v >= 1000 && u < units.length-1) { v /= 1000; u++; }
      return v.toFixed(2) + units[u];
    }
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      var star = d.star || 0;
      var total = d.totalBalls || 0;
      var targets = [20, 60, 1900];
      document.getElementById('rankLabel').textContent = 'ランク' + star;
      document.getElementById('menuBalls').textContent = fmt(d.balls||0);
      document.getElementById('menuCoins').textContent = fmt(d.coins||0);
      var t = targets[Math.min(star,2)];
      document.getElementById('menuFill').style.width = Math.min(100, total/t*100)+'%';
      document.getElementById('track1').style.width = Math.min(100, total/targets[2]*100)+'%';
      document.getElementById('stars1').innerHTML =
        '★'.repeat(star) + '☆'.repeat(3-star);
    } catch(e) {}
  })();

  document.getElementById('stage1').addEventListener('click', function(){
    location.href = 'game.html';
  });
</script>
</body>
</html>
