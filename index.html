<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbloom</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Zen Maru Gothic",sans-serif; background:#0a0e1a; color:#e8eefc;
    min-height:100vh; overflow-x:hidden; }

  /* 背景光晕 */
  .glow { position:fixed; border-radius:50%; filter:blur(100px); opacity:.35; z-index:0; }
  .glow1 { width:500px; height:500px; background:#6a3fa0; top:-100px; left:-100px; }
  .glow2 { width:400px; height:400px; background:#2a6a9a; bottom:-80px; right:-80px; }
  .glow3 { width:300px; height:300px; background:#9a5a8a; top:40%; left:60%; }

  /* 浮动小球 */
  .ball { position:fixed; border-radius:50%; z-index:0; opacity:.6;
    animation:float 6s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-30px)} }

  main { position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:60px 24px; }

  .hero { text-align:center; padding:40px 0 60px; }
  .logo { font-size:96px; font-weight:900; letter-spacing:6px;
    background:linear-gradient(135deg,#ffd54f 0%,#ff8a65 35%,#ce93d8 70%,#64b5f6 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,213,79,.2)); }
  .sub { font-size:16px; color:#8a9bc0; margin-top:12px; letter-spacing:2px; }

  .cta { display:inline-block; margin-top:36px; padding:16px 56px; font-size:18px; font-weight:700;
    color:#0a0e1a; background:linear-gradient(135deg,#ffd54f,#ffb300); border-radius:50px;
    text-decoration:none; box-shadow:0 8px 30px rgba(255,179,0,.3); transition:transform .2s; }
  .cta:hover { transform:scale(1.05); }

  /* 截图卡片 */
  .shot-card { margin:40px auto; border-radius:20px; overflow:hidden;
    border:1px solid rgba(255,255,255,.1); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .shot-card img { width:100%; display:block; }

  /* 特性三列 */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; margin-top:40px; }
  .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
    border-radius:16px; padding:24px; backdrop-filter:blur(10px); }
  .card .ic { font-size:28px; margin-bottom:10px; }
  .card h3 { font-size:15px; color:#ffd54f; margin-bottom:8px; }
  .card p { font-size:13px; color:#9ab; line-height:1.7; }

  footer { text-align:center; padding:40px; font-size:11px; color:#567; }
</style>
</head>
<body>
  <div class="glow glow1"></div>
  <div class="glow glow2"></div>
  <div class="glow glow3"></div>
  <div class="ball" style="width:20px;height:20px;background:#ffd54f;top:20%;left:10%;"></div>
  <div class="ball" style="width:14px;height:14px;background:#64b5f6;top:60%;left:85%;animation-delay:1s;"></div>
  <div class="ball" style="width:26px;height:26px;background:#ce93d8;top:30%;left:90%;animation-delay:2s;"></div>
  <div class="ball" style="width:12px;height:12px;background:#81c784;top:75%;left:5%;animation-delay:.5s;"></div>

  <main>
    <div class="hero">
      <div class="logo">Orbloom</div>
      <div class="sub">雨上がりのピンボール・インクリメンタル</div>
      <a class="cta" href="game.html">▶ はじめる</a>
    </div>

    <div class="shot-card">
      <img src="docs/stage1_main.png" alt="Orbloom screenshot">
    </div>

    <div class="grid">
      <div class="card"><div class="ic">🪣</div><h3>物理ギミック</h3><p>雨粒の釘を弾み、バケツに落ちる。オリジナルの物理エンジンで構築。</p></div>
      <div class="card"><div class="ic">✨</div><h3>光る釘</h3><p>強化するたびに釘がひとつ光り、盤面全体が輝きだす。</p></div>
      <div class="card"><div class="ic">🌧️</div><h3>雨音BGM</h3><p>雨音とピアノのBGM。まったり放置できる。</p></div>
    </div>
  </main>

  <footer>Orbloom — 個人制作インディーゲーム · ブラウザで即プレイ</footer>
</body>
</html>
